# Worktrunk user config. Worktree paths, merge detection and branch deletion
# are worktrunk defaults; only hooks live here. They apply to every repo, and
# everything repo-specific comes from template variables ({{ repo }},
# {{ remote }}, {{ default_branch }}).
#
# Personal tooling, deliberately not in any app repo (no .config/wt.toml):
# herdr and worktrunk are local orchestration. Replaces ~/.local/bin/agent-wt.
#
# Rails apps (bin/rails, with pg and dotenv in Gemfile.lock) get their own
# Postgres database per worktree, <repo>_test_<branch>, so an agent there can
# never reach the shared development or test database. DATABASE_URL goes in
# .env.test.local and .env.development.local, which dotenv loads
# automatically (gitignored by `.env.*`), so Rails config stays stock. Other
# repos get no database. A Rails app without pg and dotenv is refused, since
# skipping the database would leave the agent on the shared one;
# `wt switch --create <branch> --no-hooks` bypasses that deliberately.

# Blocking: a failure here stops `wt switch --create`, and the herdr plugin
# then opens no workspace, so no agent starts in a half-set-up worktree.
[pre-start]
setup = """
set -eu
cd '{{ worktree_path }}'

# worktrunk branches from the local default branch and never fetches; that is
# usually behind. A brand-new branch still sitting on its commit is
# fast-forwarded to the remote's. --ff-only can't lose anything, and an
# existing branch (a PR checkout) has its own commits, so it never matches.
git fetch -q '{{ remote }}'
if [ "$(git rev-parse HEAD)" = "$(git rev-parse '{{ default_branch }}')" ]; then
  git merge -q --ff-only '{{ remote }}/{{ default_branch }}'
fi

mkdir -p .claude
cat > .claude/settings.local.json <<'JSON'
{
  "permissions": {
    "defaultMode": "auto",
    "deny": [
      "Bash(heroku pg*)",
      "Bash(heroku run*)",
      "Bash(heroku config*)",
      "Bash(heroku releases:rollback*)",
      "Bash(heroku ps:restart*)",
      "Bash(heroku ps:scale*)",
      "Bash(git push --force*)",
      "Bash(git push -f*)",
      "Bash(git push {{ remote }} {{ default_branch }}*)",
      "Bash(git push {{ remote }} HEAD:{{ default_branch }}*)",
      "Bash(gh pr merge*)",
      "Bash(wt merge*)",
      "Bash(wt remove*)",
      "Bash(wt step*)"
    ]
  }
}
JSON

[ -x bin/rails ] || { echo "not a Rails app: no per-worktree database"; exit 0; }
if ! grep -qE '^    pg ' Gemfile.lock || ! grep -qE '^    dotenv(-rails)? ' Gemfile.lock; then
  echo "Rails app without pg and dotenv in Gemfile.lock: can't give this worktree its own database" >&2
  exit 1
fi

app=$(printf '%s' '{{ repo }}' | tr 'A-Z' 'a-z' | tr -c 'a-z0-9' '_')
db=$(printf '%s' "${app}_test_{{ branch | sanitize_db }}" | cut -c1-63)
url="postgres://localhost/$db"

for env in test development; do
  printf '# Written by the worktrunk pre-start hook (~/.config/worktrunk/config.toml):\\n# this worktree'"'"'s own database. `wt remove` drops it.\\nDATABASE_URL=%s\\n' "$url" > ".env.$env.local"
done

# Explicit DATABASE_URL: creating and loading can only touch the new database.
DATABASE_URL="$url" RAILS_ENV=test bin/rails db:create db:schema:load >/dev/null

# Then prove the dotenv files alone route both environments to it.
# env -u: an inherited DATABASE_URL would beat the dotenv files.
test_db=$(env -u DATABASE_URL RAILS_ENV=test bin/rails runner 'print ActiveRecord::Base.connection_db_config.database')
dev_db=$(env -u DATABASE_URL RAILS_ENV=development bin/rails runner 'print ActiveRecord::Base.connection_db_config.database')
if [ "$test_db" != "$db" ] || [ "$dev_db" != "$db" ]; then
  echo "worktree resolves to test=$test_db dev=$dev_db, expected $db" >&2
  exit 1
fi
echo "database $db created; test and development both resolve to it"
"""

# Background, after the worktree is gone (output in .git/wt/logs/).
# WITH (FORCE) ends leftover sessions -- a server or console still running in
# the removed worktree's panes -- instead of leaving the database behind.
[post-remove]
drop-db = """
set -eu
[ -x '{{ primary_worktree_path }}/bin/rails' ] || exit 0
app=$(printf '%s' '{{ repo }}' | tr 'A-Z' 'a-z' | tr -c 'a-z0-9' '_')
db=$(printf '%s' "${app}_test_{{ branch | sanitize_db }}" | cut -c1-63)
# Never the shared databases: only per-worktree names get past this.
case "$db" in
  *[!a-z0-9_]*) echo "refusing to drop '$db'" >&2; exit 1 ;;
  "${app}"_test_?*) ;;
  *) echo "refusing to drop '$db'" >&2; exit 1 ;;
esac
psql -X -q -d postgres -c "DROP DATABASE IF EXISTS \\"$db\\" WITH (FORCE)"
echo "dropped database $db"
"""
